<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração Neon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="600" height="600"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"];
    const total = 120;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    let i = 0;

    function drawStep() {
      if (i >= total) {
        // Pausa breve quando termina e reinicia o loop
        setTimeout(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          i = 0;
          requestAnimationFrame(drawStep);
        }, 600);
        return;
      }

      const angle = i * (Math.PI * 2) / total;
      
      // Equação do coração
      const x = 16 * Math.pow(Math.sin(angle), 3) * 15;
      const y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * 15;

      const startX = centerX;
      const startY = centerY - 48; // Equivalente ao (0, 48) do Python

      const targetX = centerX + x;
      const targetY = centerY - y;  // Inverte o Y para renderizar de pé no canvas

      const color = colors[Math.floor(Math.random() * colors.length)];

      // Desenha a linha principal
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.moveTo(startX, startY);
      ctx.lineTo(targetX, targetY);
      ctx.stroke();

      // Desenha a explosão de 8 pontas no final
      for (let j = 0; j < 8; j++) {
        const starAngle = (j * 45) * (Math.PI / 180);
        const endX = targetX + 6 * Math.cos(starAngle);
        const endY = targetY + 6 * Math.sin(starAngle);

        ctx.beginPath();
        ctx.moveTo(targetX, targetY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }

      i++;

      // Próximo passo do desenho
      setTimeout(() => {
        requestAnimationFrame(drawStep);
      }, 20); // Velocidade do desenho
    }

    // Inicia a animação
    drawStep();
  </script>

</body>
</html>
